name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - name: Parse JSON and schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          for path in sorted(Path("schemas").rglob("*.json")):
              Draft202012Validator.check_schema(json.loads(path.read_text()))
          for path in sorted(Path("fixtures").rglob("*.json")):
              json.loads(path.read_text())
          PY
      - if: matrix.python-version == '3.12'
        run: python -m build
      - if: matrix.python-version == '3.12'
        run: python -m pip install --force-reinstall dist/*.whl
      - if: matrix.python-version == '3.12'
        run: ccac validate fixtures/valid/minimal-finops-lite-result.json
      - if: matrix.python-version == '3.12'
        run: ccac validate fixtures/valid/1.1.0/technology-spend-report.json
      - if: matrix.python-version == '3.12'
        name: Verify packaged schemas
        run: |
          python - <<'PY'
          from importlib.resources import files

          schemas = files("ccac.schemas")
          assert schemas.joinpath("common.schema.json").is_file()
          assert schemas.joinpath("1.1.0", "common.schema.json").is_file()
          PY
